name: APK yigish

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Android loyihasini yaratish
        run: |
          set -e
          P=app/src/main
          mkdir -p $P/assets $P/java/uz/husan/karate $P/res/values $P/res/mipmap-xxxhdpi
          cp index.html $P/assets/index.html
          grep -o 'data:image/png;base64,[^"]*' index.html | head -1 | cut -d, -f2 | base64 -d > $P/res/mipmap-xxxhdpi/ic_launcher.png

          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "HusansKarate"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.7.3' apply false }
          EOF

          echo "android.useAndroidX=true" > gradle.properties

          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'uz.husan.karate'
              compileSdk 35
              defaultConfig {
                  applicationId "uz
