<body>
<canvas id="game"></canvas>
<script>
'use strict';
/* =========================================================
   HUSAN'S KARATE — 00 CORE: canvas, utils, storage, input
   ========================================================= */
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
let W = 960, H = 540, SC = 1, DPR = 1, PORTRAIT = false, GY = 460, GT = 0;
const IS_TOUCH = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
const OUT = '#1b1424';
const F_HEAD = '"Arial Black","Roboto Black",Impact,"Roboto",sans-serif';
const F_UI = '"Trebuchet MS","Roboto",Arial,sans-serif';

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  const cw = window.innerWidth, ch = window.innerHeight;
  cv.width = Math.max(1, Math.round(cw * DPR));
  cv.height = Math.max(1, Math.round(ch * DPR));
  PORTRAIT = ch > cw * 1.05;
  H = 540; SC = cv.height / H; W = cv.width / SC;
  if (W < 760) { W = 760; SC = cv.width / W; H = cv.height / SC; }
  GY = H - 80;
  if (typeof Stages !== 'undefined') Stages.invalidate();
  if (typeof Controls !== 'undefined') Controls.layout();
  if (scene && scene.layout) scene.layout();
}

/* ---------- utils ---------- */
const U = {
  clamp: (v, a, b) => v < a ? a : v > b ? b : v,
  lerp: (a, b, t) => a + (b - a) * t,
  rnd: (a, b) => a + Math.random() * (b - a),
  irnd: (a, b) => Math.floor(a + Math.random() * (b - a + 1)),
  pick: a => a[Math.floor(Math.random() * a.length)],
  hash(n) { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); },
  shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; },
  shade(hex, amt) {
    let c = hex.replace('#', '');
    if (c.length === 3) c = c[0] + c[0] + c[1] + c[1] + c[2] + c[2];
    let r = parseInt(c.slice(0, 2), 16), g = parseInt(c.slice(2, 4), 16), b = parseInt(c.slice(4, 6), 16);
    if (amt < 0) { r *= 1 + amt; g *= 1 + amt; b *= 1 + amt; }
    else { r += (255 - r) * amt; g += (255 - g) * amt; b += (255 - b) * amt; }
    const h = v => ('0' + Math.round(U.clamp(v, 0, 255)).toString(16)).slice(-2);
    return '#' + h(r) + h(g) + h(b);
  },
  rr(g, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
  },
  fmtTime(f) { const s = Math.ceil(f / 60); return s < 10 ? '0' + s : '' + s; },
};

function txt(g, s, x, y, size, col = '#fff', align = 'center', stroke = null, sw = 0, font = F_HEAD) {
  g.font = `${size}px ${font}`; g.textAlign = align; g.textBaseline = 'middle';
  if (stroke && sw) { g.lineJoin = 'round'; g.lineWidth = sw; g.strokeStyle = stroke; g.strokeText(s, x, y); }
  g.fillStyle = col; g.fillText(s, x, y);
}
function wrapText(g, s, x, y, maxW, lh, size, col, font = F_UI, align = 'left') {
  g.font = `${size}px ${font}`; g.fillStyle = col; g.textAlign = align; g.textBaseline = 'middle';
  const words = s.split(' '); let line = '', yy = y;
  for (const w of words) {
    const t = line ? line + ' ' + w : w;
    if (g.measureText(t).width > maxW && line) { g.fillText(line, x, yy); line = w; yy += lh; } else line = t;
  }
  if (line) g.fillText(line, x, yy);
  return yy + lh;
}

/* ---------- storage ---------- */
const Store = {
  key: 'husans_karate_v1', data: null,
  defaults() {
    return {
      settings: { music: true, sfx: true, vib: true, btnSize: 1, btnAlpha: 0.38, difficulty: 1, rounds: 3, layout: {} },
      player: 0, stage: -1, unlocked: [0, 1, 2, 3, 4],
      records: { wins: 0, losses: 0, kos: 0, perfects: 0, tourBest: 0, tourScore: 0, tourWins: 0, fastestKO: 0, bestCombo: 0 },
    };
  },
  load() {
    const d = this.defaults();
    try {
      const s = localStorage.getItem(this.key);
      const o = s ? JSON.parse(s) : {};
      this.data = Object.assign(d, o);
      this.data.settings = Object.assign(this.defaults().settings, o.settings || {});
      this.data.records = Object.assign(this.defaults().records, o.records || {});
      if (!Array.isArray(this.data.unlocked)) this.data.unlocked = [0, 1, 2, 3, 4];
    } catch (e) { this.data = d; }
  },
  save() { try { localStorage.setItem(this.key, JSON.stringify(this.data)); } catch (e) { } },
  isUnlocked(i) { return this.data.unlocked.includes(i); },
  unlock(i) { if (!this.isUnlocked(i)) { this.data.unlocked.push(i); this.save(); return true; } return false; },
};

function vibrate(ms) {
  if (!Store.data.settings.vib) return;
  try {
    if (window.AndroidBridge && window.AndroidBridge.vibrate) window.AndroidBridge.vibrate(ms);
    else if (navigator.vibrate) navigator.vibrate(ms);
  } catch (e) { }
}

/* ---------- input pad (shared by human & AI) ---------- */
class Pad {
  constructor() { this.reset(); }
  reset() {
    this.held = { l: false, r: false, u: false, b: false };
    this.hf = { l: 0, r: 0 }; this.ev = []; this.last = { l: -999, r: -999 }; this.frame = 0;
  }
  press(k) {
    if (k === 'l' || k === 'r') {
      if (this.held[k]) return;
      this.held[k] = true; this.hf[k] = 0;
      const dbl = this.frame - this.last[k] < 15;
      this.ev.push({ t: dbl ? 'D' : 'T', d: k, f: this.frame });
      this.last[k] = dbl ? -999 : this.frame;
    } else if (k === 'u' || k === 'b') this.held[k] = true;
    else this.ev.push({ t: k, f: this.frame, u: this.held.u, l: this.held.l, r: this.held.r });
  }
  release(k) { if (k in this.held) this.held[k] = false; }
  releaseAll() { for (const k in this.held) this.held[k] = false; }
  tick() {
    this.frame++;
    this.hf.l = this.held.l ? this.hf.l + 1 : 0;
    this.hf.r = this.held.r ? this.hf.r + 1 : 0;
    if (this.ev.length) this.ev = this.ev.filter(e => this.frame - e.f < 10);
  }
  take(types) {
    const i = this.ev.findIndex(e => types.includes(e.t));
    return i >= 0 ? this.ev.splice(i, 1)[0] : null;
  }
}
const HumanPad = new Pad();

const KEYMAP = {
  ArrowLeft: 'l', KeyA: 'l', ArrowRight: 'r', KeyD: 'r', ArrowUp: 'u', KeyW: 'u',
  KeyJ: 'p', KeyZ: 'p', KeyK: 'k', KeyX: 'k', KeyL: 's', KeyC: 's',
  KeyI: 'b', Space: 'b', KeyS: 'b', ArrowDown: 'b',
};
window.addEventListener('keydown', e => {
  Sound.init();
  if (e.code === 'Escape' || e.code === 'KeyP') { if (scene && scene.back) scene.back(); e.preventDefault(); return; }
  const k = KEYMAP[e.code];
  if (k) { if (!e.repeat) HumanPad.press(k); e.preventDefault(); }
  else if ((e.code === 'Enter' || e.code === 'NumpadEnter') && scene && scene.enterKey) scene.enterKey();
});
window.addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) HumanPad.release(k); });

/* ---------- pointer routing ---------- */
function toLogical(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}
let triedFS = false;
function tryFullscreen() {
  if (triedFS || !IS_TOUCH || window.AndroidBridge) return; triedFS = true;
  try {
    const el = document.documentElement;
    const p = el.requestFullscreen ? el.requestFullscreen() : null;
    if (p && p.then) p.then(() => { try { screen.orientation.lock('landscape').catch(() => { }); } catch (e) { } }).catch(() => { });
  } catch (e) { }
}
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); Sound.init(); tryFullscreen();
  try { cv.setPointerCapture(e.pointerId); } catch (_) { }
  const p = toLogical(e); if (scene && scene.down) scene.down(p.x, p.y, e.pointerId);

let scene = null;
function setScene(s) {
  if (scene && scene.exit) scene.exit();
  HumanPad.reset();
  if (typeof Controls !== 'undefined') Controls.clear();
  scene = s; if (s.enter) s.enter(); if (s.layout) s.layout();
}
window.onAndroidBack = () => { if (scene && scene.back) scene.back(); };
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { Sound.suspend(); if (scene && scene.autoPause) scene.autoPause(); HumanPad.releaseAll(); }
  else Sound.resume();
});

const STEP = 1000 / 60;
let acc = 0, lastT = 0, fpsT = 0, fpsN = 0, FPS = 60;
function frame(now) {
  requestAnimationFrame(frame);
  if (!lastT) lastT = now;
  let dt = now - lastT; lastT = now;
  if (dt > 200) dt = STEP;
  acc += dt;
  let n = 0;
  while (acc >= STEP - 2 && n < 4) { if (scene) scene.update(); GT++; acc -= STEP; n++; }
  if (n === 4) acc = 0;
  if (acc < 0) acc = 0;
  fpsN++; fpsT += dt; if (fpsT >= 1000) { FPS = fpsN; fpsN = 0; fpsT = 0; }
  ctx.setTransform(SC, 0, 0, SC, 0, 0);
  if (scene) scene.draw(ctx);
  if (PORTRAIT) drawRotateHint(ctx);
}
function drawRotateHint(g) {
  g.fillStyle = 'rgba(10,8,20,0.94)'; g.fillRect(0, 0, W, H);
  const cx = W / 2, cy = H / 2 - 40;
  g.save(); g.translate(cx, cy); g.rotate(Math.sin(GT / 30) * 0.6 - 0.6);
  g.strokeStyle = '#ffd166'; g.lineWidth = 6; U.rr(g, -40, -70, 80, 140, 14); g.stroke(); g.restore();
  txt(g, "Telefonni yotqizing", cx, cy + 120, 34, '#fff');
  txt(g, "(gorizontal holat)", cx, cy + 160, 22, '#ffd166', 'center', null, 0, F_UI);
}

const THEMES = [

];

function seededRand(seed) { let s = seed * 9301 + 49297; return () => { s = (s * 9301 + 49297) % 233280; return s / 233280; }; }

function genSong(th) {
  const R = seededRand(th.seed), sc = SCALES[th.scale], len = 64;
  const mel = new Array(len).fill(null), bass = new Array(len).fill(null);
  const deg = d => { const o = Math.floor(d / sc.length); const i = ((d % sc.length) + sc.length) % sc.length; return sc[i] + o * 12; };
  // motif of 16 steps repeated with variation
  const motif = []; let cur = 7;
  for (let i = 0; i < 16; i++) {
    if (R() < 0.55 || i === 0) { cur += Math.round((R() - 0.5) * 4); cur = U.clamp(cur, 3, 12); motif.push(cur); } else motif.push(null);
  }
  for (let bar = 0; bar < 4; bar++) {
    const ch = th.prog[bar];
    for (let i = 0; i < 16; i++) {
      const st = bar * 16 + i;
      let m = motif[i];
      if (m !== null) { if (bar === 3 && i > 8) m += (R() < 0.5 ? 2 : -1); mel[st] = th.root + 12 + deg(m + (bar % 2 ? ch % 3 : 0)); }
      if (i % 4 === 0 || (th.drums === 'funk' && i % 4 === 3) || (th.drums === 'electro' && i % 2 === 0)) bass[st] = th.root - 12 + deg(ch);
    }
  }
  return { bpm: th.bpm, len, mel, bass, drums: th.drums, lead: th.lead, bassW: th.bass };
}

const Sound = {
  ac: null, master: null, mus: null, sfxG: null, noise: null, timer: null, song: null, cur: -1, pending: -1,

    this.mus = a.createGain(); this.sfxG = a.createGain(); this.mus.connect(this.master); this.sfxG.connect(this.master);
    const len = a.sampleRate; const b = a.createBuffer(1, len, a.sampleRate); const d = b.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;

  },
  suspend() { if (this.ac) this.ac.suspend().catch(() => { }); },
  resume() { if (this.ac) { this.ac.resume().catch(() => { }); this.nextT = this.ac.currentTime + 0.05; } },
  apply() {
    if (!this.ac) return; const s = Store.data.settings;
    this.mus.gain.value = s.music ? 0.3 : 0; this.sfxG.gain.value = s.sfx ? 0.9 : 0;
  },
  osc(type, f0, f1, dur, vol, when = 0, dest = null) {
    const a = this.ac, t = a.currentTime + when;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t);
    if (f1) o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
    o.connect(g); g.connect(dest || this.sfxG); o.start(t); o.stop(t + dur + 0.03);
  },
  nz(dur, vol, freq, q = 1, type = 'bandpass', when = 0, dest = null, f1 = 0) {
    const a = this.ac, t = a.currentTime + when;
    const s = a.createBufferSource(); s.buffer = this.noise;
    const f = a.createBiquadFilter(); f.type = type; f.frequency.setValueAtTime(freq, t); f.Q.value = q;
    if (f1) f.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const g = a.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
    s.connect(f); f.connect(g); g.connect(dest || this.sfxG); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.03);
  },
  play(n) {
    if (!this.ac || !Store.data.settings.sfx || this.ac.state !== 'running') return;
    try {
      switch (n) {
        case 'hit': this.nz(0.1, 0.9, 1100, 0.8); this.osc('sine', 170, 55, 0.12, 0.8); break;
        case 'heavy': this.nz(0.22, 1, 650, 0.6); this.osc('sine', 130, 35, 0.28, 1); this.osc('square', 90, 40, 0.1, 0.12); break;
        case 'block': this.nz(0.07, 0.5, 3200, 2, 'highpass'); this.osc('triangle', 950, 620, 0.07, 0.25); break;
        case 'whoosh': this.nz(0.13, 0.22, 700, 0.7, 'bandpass', 0, null, 2400); break;
        case 'whooshH': this.nz(0.22, 0.32, 400, 0.6, 'bandpass', 0, null, 1600); break;
        case 'btn': this.osc('triangle', 620, 930, 0.06, 0.22); break;
        case 'tap': this.osc('sine', 420, 300, 0.035, 0.12); break;
        case 'ko': this.osc('sawtooth', 240, 50, 0.9, 0.3); this.nz(0.7, 0.6, 420, 0.5); this.osc('sine', 80, 30, 0.8, 0.7); break;
        case 'special': this.osc('sawtooth', 200, 900, 0.32, 0.18); this.osc('square', 300, 1300, 0.3, 0.07); break;

        case 'guardbreak': this.osc('square', 320, 90, 0.35, 0.22); this.nz(0.3, 0.7, 1600, 0.5); break;
        case 'land': this.nz(0.18, 0.6, 220, 0.7, 'lowpass'); this.osc('sine', 95, 35, 0.2, 0.6); break;
        case 'counter': this.osc('square', 1200, 1900, 0.12, 0.12); this.osc('square', 1800, 2600, 0.12, 0.08, 0.06); break;
        case 'round': this.osc('triangle', 440, 0, 0.18, 0.3); this.osc('triangle', 660, 0, 0.25, 0.3, 0.16); break;
        case 'fight': [392, 523, 659, 784].forEach((f, i) => this.osc('sawtooth', f, 0, 0.16, 0.16, i * 0.07)); this.nz(0.4, 0.4, 2500, 0.5, 'highpass', 0.28); break;
        case 'win': [523, 659, 784, 1046, 784, 1046].forEach((f, i) => this.osc('square', f, 0, 0.18, 0.12, i * 0.11)); break;
        case 'lose': [392, 349, 311, 262].forEach((f, i) => this.osc('triangle', f, 0, 0.3, 0.2, i * 0.22)); break;
        case 'unlock': [660, 880, 1320].forEach((f, i) => this.osc('sine', f, 0, 0.25, 0.25, i * 0.09)); break;

  },
  drumAt(kind, t) {

    }
  },
  playStep(i, t) {
    const S = this.song, sp = 60 / S.bpm / 4, b = i % 16;
    switch (S.drums) {
      case 'rock': if (b % 8 === 0 || b === 10) this.drumAt('k', t); if (b % 8 === 4) this.drumAt('s', t); if (b % 2 === 0) this.drumAt('h', t); break;
      case 'funk': if (b === 0 || b === 6 || b === 10) this.drumAt('k', t); if (b % 8 === 4) this.drumAt('s', t); this.drumAt('h', t); break;
      case 'soft': if (b === 0 || b === 8) this.drumAt('k', t); if (b % 4 === 2) this.drumAt('h', t); break;
      case 'tribal': if (b % 4 === 0) this.drumAt('t', t); if (b === 6 || b === 14) this.drumAt('t', t); if (b % 8 === 4) this.drumAt('s', t); break;
      case 'taiko': if (b === 0 || b === 3 || b === 8 || b === 11) this.drumAt('t', t); if (b === 12) this.drumAt('s', t); break;
      case 'doira': if (b === 0 || b === 6 || b === 8) this.drumAt('t', t); if (b === 4 || b === 12 || b === 14) this.drumAt('s', t); if (b % 2 === 1) this.drumAt('h', t); break;
      case 'electro': if (b % 4 === 0) this.drumAt('k', t); if (b % 8 === 4) this.drumAt('s', t); if (b % 2 === 1) this.drumAt('h', t); break;

  playMusic(i, force) {

  },
  stopMusic() { if (this.timer) clearInterval(this.timer); this.timer = null; this.cur = -1; },
  sched() {
    const a = this.ac; if (!a || a.state !== 'running' || !this.song) return;
    const sp = 60 / this.song.bpm / 4;
    if (this.nextT < a.currentTime) this.nextT = a.currentTime + 0.02;
    while (this.nextT < a.currentTime + 0.15) {
      if (Store.data.settings.music) { try { this.playStep(this.step, this.nextT); } catch (e) { } }

    }
  },
};

  ember(x, y, col) { this.add({ type: 'dot', x, y, vx: U.rnd(-1, 1), vy: U.rnd(-3, -1), g: -0.02, life: U.irnd(14, 26), max: 26, col, r: U.rnd(2, 5) }); },

/* =========================================================
   05 AI: spacing, blocking, punishing, combos
   ========================================================= */
// level 0 = Oson, 1 = O'rta, 2 = Qiyin (fractions interpolate)
const AI_LEVELS = [
  { react: 26, think: 24, block: 0.22, punish: 0.18, aggr: 0.32, combo: 0.15, spacing: 0.35, special: 0.3, smart: 0.1 },
  { react: 14, think: 13, block: 0.55, punish: 0.62, aggr: 0.48, combo: 0.5, spacing: 0.7, special: 0.6, smart: 0.5 },
  { react: 7, think: 6, block: 0.82, punish: 0.94, aggr: 0.58, combo: 0.88, spacing: 0.92, special: 0.85, smart: 0.88 },
];
function aiParams(level) {
  level = U.clamp(level, 0, 2);
  const i = Math.min(1, Math.floor(level)), t = level - i, a = AI_LEVELS[i], b = AI_LEVELS[i + 1], o = {};
  for (const k in a) o[k] = U.lerp(a[k], b[k], t);
  return o;
}

class AI {
  constructor(level, mode = 'cpu') {
    this.pad = new Pad(); this.L = aiParams(level); this.mode = mode;
    this.cool = 20; this.blockHold = 0; this.seen = ''; this.since = 0; this.moveDir = 0;
    this.punishSerial = -1; this.punishDelay = 0; this.punishGo = false; this.chainSerial = -1;
    this.dummyBlock = false; this.reactF = Math.round(this.L.react);
  }
  hold(dir, fwd, back) {
    const p = this.pad;
    if (dir > 0) { if (!p.held[fwd]) p.press(fwd); p.release(back); }
    else if (dir < 0) { if (!p.held[back]) p.press(back); p.release(fwd); }
    else { p.release('l'); p.release('r'); }
  }
  reach(f, m) { return m.range * f.c.reach * f.c.scale + 22; }
  update(me, opp, G) {
    const p = this.pad, L = this.L;
    const dx = opp.x - me.x, dist = Math.abs(dx);
    const fwd = dx > 0 ? 'r' : 'l', back = dx > 0 ? 'l' : 'r';
    if (this.mode === 'dummy') {
      p.release('l'); p.release('r');
      const threat = opp.state === 'attack' && opp.phase() !== 'rec';
      p.held.b = this.dummyBlock && (threat || me.state === 'blockstun');
      return;
    }
    if (opp.state === 'ko' || me.state === 'ko') { p.releaseAll(); return; }
    // perception (delayed reaction)
    const os = opp.state === 'attack' ? 'atk' + opp.serial : opp.state;
    if (os !== this.seen) { this.seen = os; this.since = 0; this.reactF = Math.round(L.react + U.rnd(-2, 4)); } else this.since++;

    // continue holding block
    if (this.blockHold > 0) {
      this.blockHold--; p.held.b = true; p.release('l'); p.release('r');
      if (this.blockHold === 0 || me.guard < 12) { p.held.b = false; this.blockHold = 0; }
      return;
    }
    p.held.b = false;

    // react to incoming attack
    if (opp.state === 'attack' && this.since === this.reactF && opp.phase() !== 'rec') {
      const m = opp.move, far = m.type === 'proj' || m.type === 'rush' || m.type === 'leap';
      if ((dist < this.reach(opp, m) + 40 || far) && me.actionable() && Math.random() < L.block) {
        if (m.guardBreak && Math.random() < L.smart) { p.ev.push({ t: 'D', d: back, f: p.frame }); this.cool = 10; return; }
        if (me.guard > 20) { this.blockHold = Math.max(8, m.startup + m.active - opp.mt + 8 + (m.type === 'rush' || m.type === 'multi' ? 12 : 0)); this.hold(0); p.held.b = true; return; }
      }
    }

    // punish an opponent who is open after a move
    if (opp.state === 'attack' && opp.phase() === 'rec') {
      const m = opp.move, left = m.total - opp.mt;
      if (this.punishSerial !== opp.serial) { this.punishSerial = opp.serial; this.punishDelay = Math.round(L.react * 0.55); this.punishGo = Math.random() < L.punish; }
      if (this.punishGo && me.actionable()) {
        if (this.punishDelay > 0) this.punishDelay--;

          const opts = ['upper', 'cross', 'kick', 'spin', 'jab'].filter(id => { const mv = MOVES[id]; return this.reach(me, mv) >= dist && mv.startup <= left + 1; });
          if (opts.length) {
            const id = opts[0]; this.punishGo = false; this.hold(0);
            if (id === 'kick' || id === 'spin') { p.press('k'); if (id === 'spin') { p.ev[p.ev.length - 1][back] = true; } }
            else { p.press('p'); }
            if (id === 'cross' || id === 'upper') this.comboWant = 2; else this.comboWant = 1;
            this.chainSerial = -1;
            return;
          } else if (dist < 260) { this.hold(1, fwd, back); return; }
        }
      }
    }

    // continue combo chain
    if (me.state === 'attack' && me.move.chain && me.mt >= me.move.startup && this.chainSerial !== me.serial) {
      this.chainSerial = me.serial;
      const want = me.hitDone ? L.combo : L.combo * 0.25;
      if (Math.random() < want) p.press('p');
      return;
    }
    if (!me.actionable()) { this.hold(0); return; }

    if (this.cool > 0) { this.cool--; this.hold(this.moveDir, fwd, back); return; }
    this.cool = Math.round(L.think + U.rnd(0, 10));

    const jabR = this.reach(me, MOVES.jab), kickR = this.reach(me, MOVES.kick), axeR = this.reach(me, MOVES.axe);
    // special
    if (me.meter >= 50 && Math.random() < L.special * 0.55) {
      const s = me.sp; let ok = false;
      if (s.type === 'proj') ok = dist > 180;
      else if (s.type === 'rush') ok = dist < 340 && dist > 80;
      else if (s.type === 'leap') ok = dist > 120 && dist < 300;
      else ok = dist < this.reach(me, s) + 10;
      if (ok && opp.state !== 'knockdown') { this.hold(0); p.press('s'); return; }
    }
    // low guard -> retreat
    if (me.guard < 25 && Math.random() < L.smart) { p.ev.push({ t: 'D', d: back, f: p.frame }); return; }
    // opponent turtling -> axe kick
    if ((opp.state === 'block' || opp.state === 'blockstun') && dist < axeR && Math.random() < L.smart * 0.8) { this.hold(0); p.held.u = true; p.press('k'); p.held.u = false; return; }
    // in range: attack
    if (opp.state !== 'knockdown' && opp.state !== 'getup') {
      if (dist < jabR && Math.random() < L.aggr) { this.hold(0); p.press('p'); return; }
      if (dist < kickR && dist > jabR * 0.7 && Math.random() < L.aggr * 0.55) {
        this.hold(0); const r = Math.random();
        if (r < 0.2) { p.press('k'); p.ev[p.ev.length - 1][back] = true; }
        else p.press('k');
        return;
      }
    }
    // spacing
    const aggressive = Math.random() < L.aggr;
    const desired = aggressive ? jabR * 0.85 : kickR * 0.92;
    this.moveDir = dist > desired + 18 ? 1 : dist < desired - 30 ? -1 : 0;
    if (Math.random() > L.spacing) this.moveDir = U.pick([-1, 0, 1, 1]);
    if (this.moveDir < 0 && Math.random() < L.smart * 0.25) { p.ev.push({ t: 'D', d: back, f: p.frame }); this.moveDir = 0; }
    if (this.moveDir > 0 && dist > 300 && Math.random() < 0.25) { p.ev.push({ t: 'D', d: fwd, f: p.frame }); }
    this.hold(this.moveDir, fwd, back);
  }
}

const H1 = U.hash;
function grad(g, x0, y0, x1, y1, stops) { const gr = g.createLinearGradient(x0, y0, x1, y1); stops.forEach((s, i) => gr.addColorStop(s[0], s[1])); return gr; }
function sky(g, w, h, stops) { g.fillStyle = grad(g, 0, 0, 0, h, stops); g.fillRect(0, 0, w, h); }
function ridge(g, w, base, amp, col, seed, rough = 0.012, peaks = false) {
  g.fillStyle = col; g.beginPath(); g.moveTo(0, base + 300);
  for (let x = 0; x <= w + 10; x += 10) {
    const n = Math.sin(x * rough + seed) * 0.5 + Math.sin(x * rough * 2.3 + seed * 1.7) * 0.3 + Math.sin(x * rough * 5.1 + seed * 3.1) * 0.2;
    const y = base - (peaks ? Math.abs(n) : (n + 1) / 2) * amp;
    g.lineTo(x, y);
  }
  g.lineTo(w + 10, base + 300); g.closePath(); g.fill();
}
function cloud(g, x, y, s, col = 'rgba(255,255,255,0.9)') {
  g.fillStyle = col; g.beginPath();
  g.ellipse(x, y, 40 * s, 16 * s, 0, 0, Math.PI * 2); g.ellipse(x - 26 * s, y + 4 * s, 24 * s, 12 * s, 0, 0, Math.PI * 2);

}
function pine(g, x, y, s, col, snow) {
  g.fillStyle = '#4a3020'; g.fillRect(x - 3 * s, y - 14 * s, 6 * s, 14 * s);
  for (let i = 0; i < 3; i++) {
    const yy = y - 12 * s - i * 22 * s, ww = (34 - i * 8) * s;
    g.fillStyle = col; g.beginPath(); g.moveTo(x - ww, yy); g.lineTo(x, yy - 34 * s); g.lineTo(x + ww, yy); g.closePath(); g.fill();

  }
}
function roundTree(g, x, y, s, col, trunk = '#5b3a24') {
  g.fillStyle = trunk; g.fillRect(x - 5 * s, y - 50 * s, 10 * s, 50 * s);
  g.fillStyle = col;
  for (const [dx, dy, r] of [[0, -78, 34], [-24, -62, 24], [24, -60, 26], [0, -100, 24]]) { g.beginPath(); g.arc(x + dx * s, y + dy * s, r * s, 0, Math.PI * 2); g.fill(); }
  g.fillStyle = 'rgba(255,255,255,0.08)'; g.beginPath(); g.arc(x - 8 * s, y - 92 * s, 14 * s, 0, Math.PI * 2); g.fill();
}
function bird(g, x, y, s, flap, col = '#222') {

  g.fillStyle = grad(g, 0, gy - 10, 0, h, [[0, top], [1, bottom]]); g.fillRect(0, gy - 10, w, h - gy + 10);
  if (line) { g.fillStyle = line; g.fillRect(0, gy - 12, w, 4); }

      try { STAGES[i].bake(g, W, H, GY); } catch (e) { console.error(e); }
      this.cache = {}; this.cache[key] = c; // keep only the active stage in memory
    }
    return this.cache[key];
  },
  draw(g, i, t) {
    const b = this.baked(i);
    g.save(); g.setTransform(1, 0, 0, 1, 0, 0);
    const m = g.getTransform ? null : null;
    g.restore();
    g.drawImage(b, 0, 0, W, H);
    STAGES[i].anim(g, t, W, H, GY);
  },
  drawFront(g, i, t) { },
  thumb(i, tw, th) {
    if (this.thumbs[i]) return this.thumbs[i];
    const c = document.createElement('canvas'); c.width = Math.round(tw * 2); c.height = Math.round(th * 2);
    const g = c.getContext('2d'); const vw = 960, vh = 540, s = c.width / vw;
    g.setTransform(s, 0, 0, c.height / vh, 0, 0);
    try { STAGES[i].bake(g, vw, vh, vh - 80); STAGES[i].anim(g, 200, vw, vh, vh - 80); } catch (e) { console.error(e); }
    this.thumbs[i] = c; return c;
  },
};

const Controls = {
  defs: [
    { id: 'l', x: 0.075, y: 0.80, r: 50, group: 'dir', col: '#ffffff', icon: 'left' },
    { id: 'r', x: 0.225, y: 0.80, r: 50, group: 'dir', col: '#ffffff', icon: 'right' },
    { id: 'u', x: 0.15, y: 0.585, r: 40, group: 'dir', col: '#ffffff', icon: 'up' },
    { id: 'b', x: 0.655, y: 0.86, r: 46, group: 'atk', col: '#4cc9f0', label: 'BLOK' },
    { id: 'p', x: 0.80, y: 0.82, r: 56, group: 'atk', col: '#ff9f1c', label: 'MUSHT' },
    { id: 'k', x: 0.93, y: 0.65, r: 56, group: 'atk', col: '#ef233c', label: 'TEPISH' },
    { id: 's', x: 0.93, y: 0.36, r: 44, group: 'atk', col: '#9d4edd', label: 'MAXSUS' },
  ],
  btns: [], touches: new Map(), meter: 0,
  layout() {
    const s = Store.data.settings, L = s.layout || {};
    this.btns = this.defs.map(d => { const o = L[d.id]; return Object.assign({}, d, { x: (o ? o.x : d.x) * W, y: (o ? o.y : d.y) * H, r: d.r * s.btnSize, pressed: false }); });
  },
  get(id) { return this.btns.find(b => b.id === id); },
  clear() { for (const v of this.touches.values()) HumanPad.release(v); this.touches.clear(); for (const b of this.btns) b.pressed = false; },
  hit(x, y, group) {
    let best = null, bd = 1e9;
    for (const b of this.btns) {
      if (group && b.group !== group) continue;
      const d = Math.hypot(b.x - x, b.y - y);
      if (d < b.r * 1.28 && d < bd) { best = b; bd = d; }
    }
    return best;
  },
  refresh() { const held = new Set(this.touches.values()); for (const b of this.btns) b.pressed = held.has(b.id); },
  down(x, y, id) {
    const b = this.hit(x, y); if (!b) return false;
    this.touches.set(id, b.id); HumanPad.press(b.id); this.refresh();
    vibrate(b.group === 'dir' ? 8 : 14); Sound.play('tap');
    return true;
  },
  move(x, y, id) {
    const cur = this.touches.get(id); if (!cur) return;
    const cb = this.get(cur); if (!cb || cb.group !== 'dir') return;
    const b = this.hit(x, y, 'dir');
    if (b && b.id !== cur) {
      this.touches.set(id, b.id);
      if (![...this.touches.values()].includes(cur)) HumanPad.release(cur);
      HumanPad.press(b.id); this.refresh(); vibrate(6);
    }
  },
  up(x, y, id) {
    const cur = this.touches.get(id); if (!cur) return;
    this.touches.delete(id);
    if (![...this.touches.values()].includes(cur)) HumanPad.release(cur);
    this.refresh();
  },
  draw(g, meter = 0) {
    const a = Store.data.settings.btnAlpha;
    for (const b of this.btns) {
      const pr = b.pressed;
      g.save();
      g.globalAlpha = pr ? Math.min(1, a + 0.35) : a;
      g.fillStyle = b.group === 'dir' ? 'rgba(20,20,35,0.55)' : b.col;
      g.beginPath(); g.arc(b.x, b.y, b.r * (pr ? 0.94 : 1), 0, Math.PI * 2); g.fill();
      g.globalAlpha = Math.min(1, a + (pr ? 0.5 : 0.3));
      g.lineWidth = 3; g.strokeStyle = b.group === 'dir' ? '#ffffff' : U.shade(b.col, 0.5); g.stroke();
      if (b.id === 's') {
        g.globalAlpha = Math.min(1, a + 0.45); g.lineWidth = 6; g.strokeStyle = meter >= 50 ? '#ffd166' : '#c8b6ff';
        g.beginPath(); g.arc(b.x, b.y, b.r + 5, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * meter / 100); g.stroke();
        if (meter >= 50) { g.shadowColor = '#ffd166'; g.shadowBlur = 12 + Math.sin(GT * 0.2) * 6; g.beginPath(); g.arc(b.x, b.y, b.r, 0, Math.PI * 2); g.stroke(); g.shadowBlur = 0; }
      }
      g.globalAlpha = Math.min(1, a + 0.5);
      if (b.icon) {
        g.fillStyle = '#fff'; g.beginPath(); const s = b.r * 0.42;
        if (b.icon === 'left') { g.moveTo(b.x - s, b.y); g.lineTo(b.x + s * 0.7, b.y - s); g.lineTo(b.x + s * 0.7, b.y + s); }
        if (b.icon === 'right') { g.moveTo(b.x + s, b.y); g.lineTo(b.x - s * 0.7, b.y - s); g.lineTo(b.x - s * 0.7, b.y + s); }
        if (b.icon === 'up') { g.moveTo(b.x, b.y - s); g.lineTo(b.x - s, b.y + s * 0.7); g.lineTo(b.x + s, b.y + s * 0.7); }
        g.closePath(); g.fill();
      } else txt(g, b.label, b.x, b.y, Math.round(b.r * 0.32), '#fff', 'center', 'rgba(0,0,0,0.6)', 3);
      g.restore();
    }
  },
};

/* ---------- menu button ---------- */
class UIBtn {
  constructor(o) { Object.assign(this, { x: 0, y: 0, w: 220, h: 58, label: '', col: '#e63946', size: 24, enabled: true, sel: false, sub: '' }, o); this.pr = false; }
  contains(x, y) { return x >= this.x && x <= this.x + this.w && y >= this.y && y <= this.y + this.h; }
  draw(g) {
    const pr = this.pr, y = this.y + (pr ? 3 : 0), col = this.enabled ? this.col : '#555';
    g.save();
    U.rr(g, this.x, this.y + 6, this.w, this.h, 14); g.fillStyle = 'rgba(0,0,0,0.35)'; g.fill();
    U.rr(g, this.x, y, this.w, this.h, 14);
    g.fillStyle = grad(g, 0, y, 0, y + this.h, [[0, U.shade(col, 0.25)], [1, U.shade(col, -0.2)]]); g.fill();
    g.lineWidth = this.sel ? 4 : 3; g.strokeStyle = this.sel ? '#ffd166' : OUT; g.stroke();
    if (this.sel) { g.shadowColor = '#ffd166'; g.shadowBlur = 14; g.stroke(); g.shadowBlur = 0; }
    g.fillStyle = 'rgba(255,255,255,0.18)'; U.rr(g, this.x + 6, y + 4, this.w - 12, this.h * 0.38, 10); g.fill();
    if (this.sub) {
      txt(g, this.label, this.x + this.w / 2, y + this.h * 0.38, this.size, '#fff', 'center', OUT, 4);
      txt(g, this.sub, this.x + this.w / 2, y + this.h * 0.74, Math.round(this.size * 0.55), '#ffe8b0', 'center', null, 0, F_UI);
    } else txt(g, this.label, this.x + this.w / 2, y + this.h / 2 + 1, this.size, '#fff', 'center', OUT, 4);
    g.restore();
  }
}

class MenuScene {
  constructor() { this.btns = []; this.t = 0; }
  layout() { }
  update() { this.t++; }
  down(x, y) { for (const b of this.btns) if (b.enabled && b.contains(x, y)) { b.pr = true; this.pressed = b; return; } this.tap && this.tap(x, y); }
  move(x, y) { if (this.pressed && !this.pressed.contains(x, y)) { this.pressed.pr = false; this.pressed = null; } }
  up(x, y) {
    const b = this.pressed; this.pressed = null;
    if (b) { b.pr = false; if (b.contains(x, y)) { Sound.play('btn'); vibrate(10); b.onTap && b.onTap(); } }
  }

}

/* ---------- HUD ---------- */
function drawBar(g, x, y, w, h, frac, back, col1, col2, flip, ghost) {
  U.rr(g, x - 3, y - 3, w + 6, h + 6, 8); g.fillStyle = OUT; g.fill();
  U.rr(g, x, y, w, h, 6); g.fillStyle = back; g.fill();
  const fw = w * U.clamp(frac, 0, 1), gw = w * U.clamp(ghost === undefined ? frac : ghost, 0, 1);
  if (gw > 0) { g.fillStyle = '#fff'; g.globalAlpha = 0.75; U.rr(g, flip ? x + w - gw : x, y, gw, h, 6); g.fill(); g.globalAlpha = 1; }
  if (fw > 0) { U.rr(g, flip ? x + w - fw : x, y, fw, h, 6); g.fillStyle = grad(g, 0, y, 0, y + h, [[0, col1], [1, col2]]); g.fill(); }
  g.fillStyle = 'rgba(255,255,255,0.25)'; g.fillRect(x + 4, y + 2, w - 8, h * 0.3);
}
function drawHUD(g, B, timer, round, roundsToWin, opts = {}) {
  const bw = Math.min(W * 0.36, 400), top = 18;
  for (let i = 0; i < 2; i++) {
    const f = B.f[i], flip = i === 1, x = flip ? W - 20 - bw : 20;
    f.dispHp += (f.hp - f.dispHp) * (f.dispHp > f.hp ? 0.04 : 1);
    const fr = f.hp / f.maxHp;
    drawBar(g, x, top + 22, bw, 24, fr, '#3a1020', fr > 0.3 ? '#ffe66d' : '#ff6b6b', fr > 0.3 ? '#f4a261' : '#c1121f', flip, f.dispHp / f.maxHp);
    txt(g, f.c.name.toUpperCase(), flip ? x + bw : x, top + 8, 18, '#fff', flip ? 'right' : 'left', OUT, 4);
    // meter
    const mw = bw * 0.6, mx = flip ? x + bw - mw : x;
    drawBar(g, mx, top + 54, mw, 10, f.meter / 100, '#1b1035', f.meter >= 50 ? '#ffd166' : '#b8a1ff', f.meter >= 50 ? '#ff9f1c' : '#7b2cbf', flip);
    g.fillStyle = OUT; g.fillRect(mx + mw / 2 - 1, top + 54, 2, 10);
    // guard
    const gw2 = bw * 0.35, gx = flip ? x : x + bw - gw2;
    drawBar(g, gx, top + 56, gw2, 6, f.guard / 100, '#10263a', '#8fd3ff', '#3a86ff', flip);
    // wins
    for (let k = 0; k < roundsToWin; k++) {
      const cx = flip ? x + bw - 10 - k * 22 : x + 10 + k * 22;
      circ(g, cx, top + 80, 7, k < f.wins ? '#ffd166' : 'rgba(0,0,0,0.4)', OUT, 2.5);
    }
  }
  // timer
  const cx = W / 2;
  circ(g, cx, top + 34, 30, '#1b1035', OUT, 4);
  txt(g, opts.training ? '∞' : U.fmtTime(timer), cx, top + 36, opts.training ? 34 : 30, timer < 600 && !opts.training ? '#ff6b6b' : '#fff', 'center', OUT, 4);
  txt(g, 'RAUND ' + round, cx, top + 76, 13, '#ffd166', 'center', OUT, 3);
}

}

      this.trainBtns = [
        new UIBtn({ x: W - 210, y: 108, w: 190, h: 40, label: 'Raqib blok: ' + (this.ai.dummyBlock ? 'HA' : "YO'Q"), size: 14, col: '#2a9d8f', onTap: () => { this.ai.dummyBlock = !this.ai.dummyBlock; this.layout(); } }),
        new UIBtn({ x: W - 210, y: 154, w: 190, h: 40, label: "Ro'yxat: " + (this.showList ? "KO'RSATISH" : 'YASHIRISH'), size: 14, col: '#6c757d', onTap: () => { this.showList = !this.showList; this.layout(); } }),
      ];
    } else this.trainBtns = [];
    if (this.resultBtns) this.buildResults();
  }
  startRound() {
    this.B.resetRound(); this.phase = 'intro'; this.pt = 0; this.timer = 60 * 60; this.B.live = false; this.koText = ''; this.resultBtns = null;
    Controls.clear(); HumanPad.reset();
  }
  onKO(att, def) {
    if (this.phase !== 'fight') return;
    this.phase = 'ko'; this.pt = 0; this.winner = att; this.koText = 'K.O.!';
    if (att.side === 0) { this.matchStats.kos++; const secs = Math.round((3600 - this.timer) / 60); if (!this.matchStats.fastest || secs < this.matchStats.fastest) this.matchStats.fastest = secs; if (att.hp >= att.maxHp) this.matchStats.perfect = true; }
  }
  timeOver() {
    const [a, b] = this.B.f; this.phase = 'ko'; this.pt = 0; this.koText = 'VAQT TUGADI!'; this.B.slow = 0;
    const ra = a.hp / a.maxHp, rb = b.hp / b.maxHp;
    this.winner = Math.abs(ra - rb) < 0.005 ? null : ra > rb ? a : b;
    Sound.play('round');
  }
  autoPause() { if (this.phase === 'fight' || this.phase === 'intro') this.paused = true; }
  back() { if (this.resultBtns) { setScene(new TitleScene()); return; } this.paused = !this.paused; HumanPad.releaseAll(); Controls.clear(); }
  update() {
    if (this.paused) return;
    this.pt++;
    const B = this.B;
    if (this.phase === 'intro') {
      if (this.pt === 1) Sound.play('round');
      if (this.pt === 62) { Sound.play('fight'); vibrate(30); }
      if (this.pt >= 75) { this.phase = 'fight'; B.live = true; }
    } else if (this.phase === 'fight') {
      if (!this.train && B.hitstop === 0) { this.timer--; if (this.timer <= 0) { this.timer = 0; this.timeOver(); } }
      this.matchStats.maxCombo = Math.max(this.matchStats.maxCombo, B.stats.maxCombo);
    } else if (this.phase === 'ko') {
      B.live = false;
      if (this.pt === 110) {
        const w = this.winner;
        if (w) { w.wins++; w.setState('victory'); w.vx = 0; }
        else { B.f[0].wins++; B.f[1].wins++; }
        Sound.play(w && w.side === 0 ? 'win' : w ? 'lose' : 'round');
      }
      if (this.pt >= 230) {
        const [a, b] = B.f;
        if (a.wins >= this.toWin || b.wins >= this.toWin) this.endMatch(a.wins >= this.toWin && (b.wins < this.toWin || a.hp >= b.hp));
        else { this.round++; this.startRound(); }
      }
    }
    B.update();
  }
  endMatch(won) {
    this.phase = 'match'; this.pt = 0; this.won = won;
    const R = Store.data.records, c = this.cfg, ms = this.matchStats;
    this.unlocked = null;
    if (c.mode !== 'train') {
      if (won) { R.wins++; R.kos += ms.kos; if (ms.perfect) R.perfects++; if (ms.fastest && (!R.fastestKO || ms.fastest < R.fastestKO)) R.fastestKO = ms.fastest; if (!c.shadow && Store.unlock(c.p2)) { this.unlocked = CHARS[c.p2].name; Sound.play('unlock'); } }
      else R.losses++;
      R.bestCombo = Math.max(R.bestCombo, ms.maxCombo);
    }
    if (c.mode === 'tour') {
      const T = c.tour;
      if (won) {
        const f = this.B.f[0], pts = 1000 + Math.round(f.hp / f.maxHp * 1000) + Math.round(this.timer / 60) * 10 + (ms.perfect ? 2000 : 0) + ms.maxCombo * 50;
        this.pts = pts; T.score += pts; T.idx++;
        R.tourBest = Math.max(R.tourBest, T.idx); R.tourScore = Math.max(R.tourScore, T.score);
        if (T.idx >= 10) R.tourWins++;
      }
    }
    Store.save();
    this.buildResults();
  }
  buildResults() {
    const c = this.cfg, bx = W / 2 - 150;
    if (c.mode === 'tour') {
      this.resultBtns = this.won
        ? [new UIBtn({ x: bx, y: 330, w: 300, h: 56, label: c.tour.idx >= 10 ? 'CHEMPION! ▶' : 'KEYINGI RAQIB ▶', size: 20, col: '#52b788', onTap: () => setScene(new TourScene(c.tour)) })]
        : [new UIBtn({ x: bx, y: 330, w: 300, h: 56, label: 'QAYTA URINISH', size: 20, col: '#f4a261', onTap: () => setScene(new FightScene(c)) })];
    } else this.resultBtns = [new UIBtn({ x: bx, y: 330, w: 300, h: 56, label: 'QAYTA JANG', size: 20, col: '#52b788', onTap: () => setScene(new FightScene(c)) })];
    this.resultBtns.push(new UIBtn({ x: bx, y: 396, w: 300, h: 56, label: 'BOSH MENYU', size: 20, col: '#e63946', onTap: () => setScene(new TitleScene()) }));
  }
  activeBtns() { return this.phase === 'match' ? this.resultBtns : this.paused ? this.pauseBtns : this.trainBtns; }
  down(x, y, id) {
    const list = this.activeBtns();
    for (const b of list || []) if (b.contains(x, y)) { b.pr = true; this.pressedBtn = b; return; }
    if (this.phase === 'match' || this.paused) return;
    if (Math.hypot(x - this.pauseBtn.x, y - this.pauseBtn.y) < this.pauseBtn.r + 10) { this.paused = true; HumanPad.releaseAll(); Controls.clear(); Sound.play('btn'); return; }
    Controls.down(x, y, id);
  }
  move(x, y, id) { if (this.pressedBtn && !this.pressedBtn.contains(x, y)) { this.pressedBtn.pr = false; this.pressedBtn = null; } Controls.move(x, y, id); }
  up(x, y, id) {
    const b = this.pressedBtn; this.pressedBtn = null;
    if (b) { b.pr = false; if (b.contains(x, y)) { Sound.play('btn'); vibrate(10); b.onTap(); } return; }
    Controls.up(x, y, id);
  }
  enterKey() { if (this.phase === 'match' && this.resultBtns) this.resultBtns[0].onTap(); else if (this.paused) this.paused = false; }
  draw(g) {
    const B = this.B;
    B.draw(g);
    drawHUD(g, B, this.timer, this.round, this.toWin, { training: this.train });
    // pause button
    const pb = this.pauseBtn; g.save(); g.globalAlpha = 0.8; circ(g, pb.x, pb.y, pb.r, 'rgba(20,12,36,0.7)', '#fff', 2.5);
    g.fillStyle = '#fff'; g.fillRect(pb.x - 8, pb.y - 9, 5, 18); g.fillRect(pb.x + 3, pb.y - 9, 5, 18); g.restore();
    if (this.phase !== 'match') Controls.draw(g, B.f[0].meter);
    if (this.train) this.drawTraining(g);
    // banners
    if (this.phase === 'intro') {
      if (this.pt < 60) { const k = Math.min(1, this.pt / 12); txt(g, 'RAUND ' + this.round, W / 2, H * 0.4, 70 * (2 - k), '#ffd166', 'center', OUT, 10); }
      else { const k = Math.min(1, (this.pt - 60) / 8); g.save(); g.globalAlpha = Math.min(1, (90 - this.pt) / 10 + 0.3); txt(g, 'FIGHT!', W / 2, H * 0.4, 110 * (1.6 - k * 0.6), '#ff4d4d', 'center', OUT, 12); g.restore(); }
    }
    if (this.phase === 'ko') {
      const k = Math.min(1, this.pt / 10);
      txt(g, this.koText, W / 2, H * 0.36, (this.koText === 'K.O.!' ? 120 : 64) * (2.2 - k * 1.2), '#ff3b3b', 'center', OUT, 12);
      if (this.pt > 110) txt(g, this.winner ? this.winner.c.name.toUpperCase() + ' YUTDI!' : 'DURRANG!', W / 2, H * 0.36 + 80, 40, '#fff', 'center', OUT, 7);
    }
    if (this.paused) {
      dimBg(g, 0.6); txt(g, 'PAUZA', W / 2, 96, 52, '#ffd166', 'center', OUT, 8);
      for (const b of this.pauseBtns) b.draw(g);
      txt(g, 'FPS: ' + FPS, W - 12, H - 12, 12, 'rgba(255,255,255,0.4)', 'right', null, 0, F_UI);
    }
    if (this.phase === 'match') this.drawResults(g);
  }
  drawTraining(g) {
    for (const b of this.trainBtns) b.draw(g);
    if (!this.showList) return;
    const c = this.B.f[0].c, x = 16, y = 104, w = Math.min(360, W * 0.38);
    const L = [
      ['MUSHT ×3', 'Jab → Cross → Uppercut'],
      ['TEPISH', 'Uzoq tepish (0.5 s ochiq!)'],
      ['ORQAGA+TEPISH', 'Aylanib tepish, yiqitadi'],
      ['▲ + TEPISH', 'Axe kick, blokni yoradi'],
      ['MAXSUS', c.sp.name + ' (50%)'],
      ['BLOK (ushlang)', 'Zararni kamaytiradi'],
      ['2× ◀ yoki ▶', 'Dash (tez qochish)'],
    ];
    panel(g, x, y, w, 28 + L.length * 22, 0.6);
    txt(g, "ZARBALAR RO'YXATI", x + w / 2, y + 15, 14, '#ffd166', 'center', null, 0, F_HEAD);
    L.forEach(([a, b], i) => { txt(g, a, x + 10, y + 38 + i * 22, 12, '#ffd166', 'left', null, 0, F_HEAD); txt(g, b, x + 10 + w * 0.43, y + 38 + i * 22, 11.5, '#fff', 'left', null, 0, F_UI); });
    const d = this.B.f[1];
    if (d.comboDmg > 0) txt(g, 'Kombo zarari: ' + Math.round(d.comboDmg), W / 2, 170, 20, '#ffd166', 'center', OUT, 4);
  }
  drawResults(g) {
    dimBg(g, Math.min(0.65, this.pt / 30));
    const pw = 460, px = W / 2 - pw / 2;
    panel(g, px, 70, pw, 400);
    txt(g, this.won ? "G'ALABA!" : "MAG'LUBIYAT", W / 2, 112, 50, this.won ? '#ffd166' : '#ff6b6b', 'center', OUT, 8);
    const ms = this.matchStats, B = this.B; let y = 168;
    const line = (a, b) => { txt(g, a, px + 30, y, 17, '#fff', 'left', null, 0, F_UI); txt(g, b, px + pw - 30, y, 17, '#ffd166', 'right', null, 0, F_HEAD); y += 28; };
    line('Eng uzun kombo', ms.maxCombo + ' zarba');
    line('Yetkazilgan zarar', Math.round(B.stats.dmg[0]));
    if (this.cfg.mode === 'tour' && this.won) line('Ochko', '+' + this.pts + '  (jami ' + this.cfg.tour.score + ')');
    if (ms.perfect && this.won) line('PERFECT!', 'Ha');
    if (this.unlocked) txt(g, 'YANGI JANGCHI OCHILDI: ' + this.unlocked.toUpperCase(), W / 2, 306, 18, '#9ef01a', 'center', OUT, 4);
    for (const b of this.resultBtns) b.draw(g);
  }
}

/* =========================================================
   09 MAIN: boot
   ========================================================= */
Store.load();
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));
resize();
setScene(new TitleScene());
requestAnimationFrame(frame);
// debug/test hook
window.__HK = { get scene() { return scene; }, setScene, FightScene, TitleScene, Store, CHARS, STAGES, HumanPad, Battle, AI, Stages };
